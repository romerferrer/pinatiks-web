services:
  db:
    image: postgres:18   # o la versión que necesites
    container_name: postgres18
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: ethernet_postgres
      POSTGRES_DB: midb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Opcional: healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miusuario -d midb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
